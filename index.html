<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreio de Sabotagem Profissional - Lucenilda Lima</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5e6e0 0%, #ede4df 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #d4a5a0 0%, #c89080 100%);
            padding: 40px 20px;
            text-align: center;
            color: white;
        }

        .foto-perfil {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 5px solid white;
            object-fit: cover;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 16px;
            opacity: 0.95;
            line-height: 1.6;
        }

        .content {
            padding: 40px 30px;
        }

        .tela {
            display: none;
        }

        .tela.ativa {
            display: block;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .pergunta {
            margin-bottom: 30px;
        }

        .pergunta h3 {
            color: #a67c6d;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .opcoes {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .opcao {
            display: flex;
            align-items: center;
            padding: 15px;
            border: 2px solid #e8d4cf;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #faf8f6;
        }

        .opcao:hover {
            background: #f5e6e0;
            border-color: #c89080;
        }

        .opcao input[type="radio"] {
            margin-right: 15px;
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #c89080;
        }

        .opcao label {
            cursor: pointer;
            flex: 1;
            color: #333;
        }

        .formulario {
            background: #faf8f6;
            padding: 25px;
            border-radius: 15px;
            margin: 30px 0;
        }

        .formulario h3 {
            color: #a67c6d;
            margin-bottom: 20px;
            font-size: 20px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            color: #a67c6d;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .campo input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e8d4cf;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        .campo input:focus {
            outline: none;
            border-color: #c89080;
            background: #fff9f7;
        }

        .erro {
            color: #d9534f;
            font-size: 13px;
            margin-top: 5px;
            display: none;
        }

        .erro.mostrar {
            display: block;
        }

        .resultado {
            background: linear-gradient(135deg, #f5e6e0 0%, #ede4df 100%);
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
        }

        .resultado h2 {
            color: #a67c6d;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .perfil-nome {
            color: #c89080;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .score {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            text-align: center;
            border-left: 5px solid #c89080;
        }

        .score-numero {
            font-size: 28px;
            color: #c89080;
            font-weight: 700;
        }

        .score-texto {
            color: #666;
            font-size: 14px;
        }

        .descricao {
            color: #333;
            line-height: 1.8;
            margin: 15px 0;
            font-size: 15px;
        }

        .orientacoes {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .orientacoes h3 {
            color: #a67c6d;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .orientacao-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #e8d4cf;
        }

        .orientacao-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .orientacao-item strong {
            color: #c89080;
            display: block;
            margin-bottom: 5px;
        }

        .orientacao-item p {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }

        .botoes {
            display: flex;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 150px;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-primario {
            background: linear-gradient(135deg, #c89080 0%, #a67c6d 100%);
            color: white;
        }

        .btn-primario:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(200, 144, 128, 0.4);
        }

        .btn-secundario {
            background: white;
            color: #c89080;
            border: 2px solid #c89080;
        }

        .btn-secundario:hover {
            background: #f5e6e0;
        }

        .btn-kiwify {
            background: linear-gradient(135deg, #c89080 0%, #a67c6d 100%);
            color: white;
            text-decoration: none;
        }

        .btn-kiwify:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(200, 144, 128, 0.4);
        }
